<!DOCTYPE html>
<html>
<head><title>RDFa Multiple</title></head>
<body>
<div vocab="https://schema.org/" typeof="Person" resource="https://example.com/person/1">
  <span property="name">Alice</span>
</div>
<div vocab="https://schema.org/" typeof="Person">
  <span property="name">Bob</span>
</div>
<div typeof="https://schema.org/Event">
  <span property="name">Tech Conference</span>
</div>
<div typeof="http://schema.org/Thing">
  <span property="name">Something</span>
</div>
</body>
</html>
