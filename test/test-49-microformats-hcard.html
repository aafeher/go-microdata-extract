<!DOCTYPE html>
<html>
<head><title>Microformats h-card</title></head>
<body>
<div class="h-card">
  <span class="p-name">Jane Doe</span>
  <span class="p-job-title">Software Engineer</span>
  <a class="u-url" href="https://example.com/janedoe">Homepage</a>
  <a class="u-email" href="mailto:jane@example.com">jane@example.com</a>
  <img class="u-photo" src="https://example.com/janedoe.jpg" alt="Jane Doe" />
</div>
</body>
</html>
