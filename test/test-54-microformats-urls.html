<!DOCTYPE html>
<html>
<head><title>Microformats URLs and Datetimes</title></head>
<body>
<div class="h-entry">
  <video class="u-video" src="https://example.com/video.mp4"></video>
  <object class="u-data" data="https://example.com/data.pdf"></object>
  <form class="u-action" action="https://example.com/submit"></form>
  <span class="u-uid">https://example.com/uid/123</span>
  <data class="p-count" value="42">forty-two</data>
  <ins class="dt-updated" datetime="2026-06-01">Updated</ins>
  <data class="dt-end" value="2026-12-31">December 31, 2026</data>
  <span class="dt-anniversary">2026-01-01</span>
  <div class="dt-reviewed h-cite">
    <span class="p-name">Reviewed Item</span>
  </div>
  <div class="e-body h-cite">
    <span class="p-name">Embedded Item</span>
  </div>
</div>
</body>
</html>
